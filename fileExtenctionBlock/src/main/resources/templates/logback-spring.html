<?xml version="1.0" encoding="UTF-8"?>
<configuration>

    <springProperty scope="context" name="APP_NAME" source="spring.application.name" defaultValue="file-extension-block"/>
    <springProperty scope="context" name="ACTIVE" source="spring.profiles.active" defaultValue="dev"/>
    <springProperty scope="context" name="GIT_SHA" source="app.git.sha" defaultValue="local-dev"/>
    <conversionRule conversionWord="maskedMsg" converterClass="dev.project.common.logging.MaskingMessageConverter"/>

    <!-- ===== DEV ===== -->
    <springProfile name="dev,local,h2">
        <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level app=%property{APP_NAME} env=%property{ACTIVE} sha=%property{GIT_SHA} trace=%X{traceId:-} %logger{36} - %maskedMsg%n</pattern>
            </encoder>
        </appender>

        <root level="INFO">
            <appender-ref ref="CONSOLE"/>
        </root>

        <!-- Access Log 전용 로거 -->
        <logger name="ACCESS_LOG" level="INFO" additivity="false">
            <appender-ref ref="CONSOLE"/>
        </logger>
    </springProfile>

    <!-- ===== PROD: CloudWatch JSON 로그 ===== -->
    <springProfile name="prod">
        <appender name="JSON_CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
            <encoder class="net.logstash.logback.encoder.LoggingEventCompositeJsonEncoder">
                <providers>

                    <!-- timestamp / level -->
                    <timestamp>
                        <timeZone>UTC</timeZone>
                    </timestamp>
                    <logLevel/>

                    <!-- message (⚠️ prod에서는 코드에서 LogMasker로 마스킹하는 것을 기본으로) -->
                    <message/>

                    <!-- logger / thread -->
                    <loggerName/>
                    <threadName/>

                    <!-- stacktrace -->
                    <stackTrace/>

                    <!-- fixed meta -->
                    <pattern>
                        <pattern>
                            {
                            "app":"${APP_NAME}",
                            "env":"${ACTIVE}",
                            "gitSha":"${GIT_SHA}"
                            }
                        </pattern>
                    </pattern>

                    <!-- MDC(traceId 등) -->
                    <mdc/>

                </providers>
            </encoder>
        </appender>

        <root level="INFO">
            <appender-ref ref="JSON_CONSOLE"/>
        </root>

        <!-- Access Log 전용 로거 -->
        <logger name="ACCESS_LOG" level="INFO" additivity="false">
            <appender-ref ref="JSON_CONSOLE"/>
        </logger>

        <logger name="org.hibernate.SQL" level="WARN"/>
        <logger name="org.springframework" level="INFO"/>
    </springProfile>

</configuration>
