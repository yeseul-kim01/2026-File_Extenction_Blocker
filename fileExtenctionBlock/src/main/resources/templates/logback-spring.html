<?xml version="1.0" encoding="UTF-8"?>
<configuration>

    <springProperty scope="context" name="APP_NAME" source="spring.application.name" defaultValue="file-extension-block"/>
    <springProperty scope="context" name="ACTIVE" source="spring.profiles.active" defaultValue="dev"/>
    <springProperty scope="context" name="GIT_SHA" source="app.git.sha" defaultValue="local-dev"/>

    <!-- 공통: MDC 키 이름 -->
    <property name="MDC_TRACE" value="traceId"/>

    <!-- ===== DEV ===== -->
    <springProfile name="dev,local,h2">
        <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level app=%property{APP_NAME} env=%property{ACTIVE} sha=%property{GIT_SHA} trace=%X{traceId:-} %logger{36} - %msg%n</pattern>
            </encoder>
        </appender>

        <root level="INFO">
            <appender-ref ref="CONSOLE"/>
        </root>
    </springProfile>

    <!-- ===== PROD: CloudWatch JSON 로그 ===== -->
    <springProfile name="prod">
        <appender name="JSON_CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
            <encoder class="net.logstash.logback.encoder.LoggingEventCompositeJsonEncoder">
                <providers>

                    <!-- timestamp / level -->
                    <timestamp>
                        <timeZone>UTC</timeZone>
                    </timestamp>
                    <logLevel/>

                    <!-- message -->
                    <message/>

                    <!-- logger / thread -->
                    <loggerName/>
                    <threadName/>

                    <!-- stacktrace -->
                    <stackTrace/>

                    <pattern>
                        <pattern>
                            {
                            "app":"${APP_NAME}",
                            "env":"${ACTIVE}",
                            "gitSha":"${GIT_SHA}"
                            }
                        </pattern>
                    </pattern>

                    <mdc/>

                </providers>
            </encoder>
        </appender>

        <root level="INFO">
            <appender-ref ref="JSON_CONSOLE"/>
        </root>

        <logger name="org.hibernate.SQL" level="WARN"/>
        <logger name="org.springframework" level="INFO"/>
    </springProfile>

</configuration>
